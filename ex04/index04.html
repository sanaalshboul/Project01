<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewpoint" content="width=device-width", initial-scale=1.0">
		<title> Collecting user input </title>
	</head>

	<body>
		<h2> User Refistiration Form </h2>

		<form action="#" method="post">
			
			<label for="full_name" > Full Name: </label>
			<input type="text" id="full_name" name="full_name" required minlength="1">

			<label for="email"> Email Address: </label>
			<input type="email" id="email" name="email" required>
				
			<label for="password" > Password: </label>
			<input type="password" id="password" name="password" required minlength="6">
			
			<br><br><br><br>
			
			<fieldset>
				<legand> Gender:  </legand>
				<input type="radio" id="male" name="gender" value="male" required>
				<label for="male"> Male </label>

				<input type="radio" id="female" name="gender" value=female" required>
				<label for="female"> Female </label>

			</fieldset>
		
			<br><br><br>

			<label for="country"> Country </label>
			<select id="country" name="country" required>
				<option value=""> Select a country </option>
				<option value="Canada" >Canada </option>
				<option value="UK"> United Kingdom </option>
				<option value="France"> France </option>
				<option value="other"> Other </option>
			</select>	

			<br><br><br>

			<label for="bio"> About yourself: </label>
			<br>
			<textarea id="bio" name="bio" rows="5" cols="40" required minlength="6"></textarea>
			
			<br><br><br>

			<input type="checkbox" id="agreement" name="agreement" required>
			<label for="agreement"> I agree to the terms and conditions </label>
			
			<br><br>
			<button type="submit" > Submit </button>
		</form>			
	</body>
</html>
